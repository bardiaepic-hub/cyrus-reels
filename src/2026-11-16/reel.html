<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07090A}
body{font-family:"Inter",sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(circle at 20% 15%,rgba(26,166,160,.14),transparent 45%),radial-gradient(circle at 90% 85%,rgba(26,166,160,.10),transparent 40%),#07090A}
#dots{inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 2px,transparent 2px);background-size:36px 36px}
/* header */
#head{left:0;right:0;top:0;height:330px;background:#101416;border-bottom:1px solid #1d2326}
#av{left:60px;top:220px;width:84px;height:84px;border-radius:50%;background:#45D9D1;color:#07090A;font-weight:800;font-size:40px;display:grid;place-items:center}
#nm{left:168px;top:222px;font-weight:700;font-size:40px;letter-spacing:-.02em}
#st{left:168px;top:272px;font-size:26px;color:#45D9D1;font-weight:500}
/* chat */
#chat{left:0;right:0;top:330px;height:1210px;overflow:hidden}
.m{position:absolute;max-width:740px;padding:24px 34px 22px;border-radius:36px;font-size:50px;line-height:1.22;letter-spacing:-.01em;font-weight:500}
.m.me{right:140px;background:#0C7773;border-bottom-right-radius:10px}
.m.th{left:60px;background:#1b2125;border-bottom-left-radius:10px}
.m small{display:block;text-align:right;font-size:21px;color:rgba(255,255,255,.55);margin-top:4px;font-weight:500}
.chip{position:absolute;left:0;right:140px;text-align:center}
.chip span{display:inline-block;background:#1b2125;color:rgba(255,255,255,.7);font-size:24px;font-weight:700;letter-spacing:.12em;padding:12px 26px;border-radius:16px;margin-left:140px}
.typ{width:150px;height:84px;display:flex;align-items:center;justify-content:center;gap:12px}
.typ i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
/* hook */
#hook{left:60px;top:240px;width:880px;padding:46px 52px 52px;background:#45D9D1;color:#07090A;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform-origin:50% 0}
#hook .k{font-weight:800;font-size:40px;letter-spacing:.06em;margin-bottom:14px}
#hook .h{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:104px;letter-spacing:-.05em;line-height:.95}
/* week later */
#later{left:60px;width:880px;top:760px;text-align:center;font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:150px;letter-spacing:-.05em;line-height:.95}
#later span{color:#45D9D1}
/* notifications */
.nb{position:absolute;left:60px;width:880px;height:128px;border-radius:32px;background:rgba(242,245,245,.96);color:#0B0D0E;display:flex;align-items:center;gap:22px;padding:0 26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.nb .ic{flex:0 0 76px;height:76px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:40px;color:#fff}
.nb .r1{display:flex;justify-content:space-between;font-size:22px;color:#6b7275;font-weight:700;letter-spacing:.04em}
.nb b{display:block;font-size:34px;letter-spacing:-.02em;line-height:1.2}
.nb .tx{flex:1}
.st{color:#f5b400;letter-spacing:.05em}
/* input bar decor (bottom, no text that matters) */
#inp{left:40px;right:40px;top:1560px;height:96px;border-radius:48px;background:#101416;opacity:.8}
/* end card */
#E{inset:0;background:#07090A;opacity:0}
#wipe{left:0;top:0;bottom:0;width:0;background:#45D9D1}
#elogo{left:220px;top:540px;width:640px}
.ec{left:70px;width:870px;text-align:center}
#e1{top:860px;font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:92px;letter-spacing:-.05em;line-height:1}
#e2{top:1080px;font-weight:500;font-size:38px;color:rgba(255,255,255,.65)}
#e3{top:1170px;left:195px;width:700px;height:116px;border-radius:99px;background:#45D9D1;color:#07090A;font-weight:800;font-size:46px;letter-spacing:-.03em;display:grid;place-items:center}
#e4{top:1350px;font-weight:700;font-size:40px;color:#45D9D1}
</style></head><body>
<div class="abs" id="bg"></div><div class="abs" id="dots"></div>
<div class="abs" id="chat"></div>
<div class="abs" id="head"></div>
<div class="abs" id="av">J</div>
<div class="abs" id="nm">Jess</div>
<div class="abs" id="st">online</div>
<div class="abs" id="inp"></div>
<div class="abs" id="later">One week<br><span>later.</span></div>
<div class="abs" id="hook"><div class="k">POV</div><div class="h">You finally sorted your Google listing.</div></div>
<div id="nbs"></div>
<div class="abs" id="wipe"></div>
<div class="abs" id="E">
  <img class="abs" id="elogo" src="../../brand/logo-light.svg">
  <div class="abs ec" id="e1">Is your Google listing<br>telling the truth?</div>
  <div class="abs ec" id="e2">We'll check it for free.</div>
  <div class="abs" id="e3">DM "CHECK"</div>
  <div class="abs ec" id="e4">@cyrusdigital</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const p=(t,a,b)=>cl((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3);
const eback=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function show(el,o,y=0,s=1,x=0){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s})`}
// section A: before. section B: after
// [type, time, text, timestamp, typingStart]
const A=[
 ['chip',-2,'MONDAY'],
 ['me',-1,'why is it so quiet today','12:41'],
 ['th',2.75,'did you ever fix your Google listing','12:42',2.25],
 ['me',3.55,'what\'s wrong with it','12:42'],
 ['th',4.45,'it says you\'re closed on Saturdays','12:43',3.95],
 ['me',5.25,'WE\'RE OPEN ON SATURDAYS','12:43'],
];
const B=[
 ['chip',6.9,'NEXT MONDAY'],
 ['me',7.05,'ok I fixed it. hours, photos, replied to every review','12:40'],
 ['th',10.15,'and?','12:41',9.8],
 ['me',10.75,'the phone hasn\'t stopped','12:41'],
 ['me',11.35,'I need another chair','12:42'],
];
const chat=$('chat');
function mk(list){return list.map(([k,t,txt,ts,ty])=>{
  const d=document.createElement('div');
  if(k==='chip'){d.className='chip';d.innerHTML=`<span>${txt}</span>`}
  else{d.className='m '+k;d.innerHTML=`${txt}<small>${ts}${k==='me'?' ✓✓':''}</small>`}
  chat.appendChild(d);
  let tyEl=null;
  if(ty!==undefined){tyEl=document.createElement('div');tyEl.className='m th typ';tyEl.innerHTML='<i></i><i></i><i></i>';chat.appendChild(tyEl)}
  return {k,t,ty,el:d,tyEl,h:0}})}
const SA=mk(A),SB=mk(B);
// measure after fonts
function measure(){[...SA,...SB].forEach(m=>{m.h=m.el.offsetHeight+(m.k==='chip'?30:22); if(m.tyEl) m.tyH=m.tyEl.offsetHeight+22})}
measure();
const NB=[
 [8.15,'#1AA6A0','✓','BOOKINGS','New booking','Tomorrow 10:30, cut and colour'],
 [8.75,'#f5b400','★','REVIEWS','New review','<span class="st">★★★★★</span>'],
 [9.35,'#1AA6A0','✓','BOOKINGS','New booking','Saturday 2pm. Yes, Saturday.'],
];
const nbs=$('nbs');
const nbEls=NB.map(([t,c,ic,app,b,s])=>{const d=document.createElement('div');d.className='nb';
 d.innerHTML=`<div class="ic" style="background:${c}">${ic}</div><div class="tx"><div class="r1"><span>${app}</span><span>now</span></div><b>${b}</b><div style="font-size:28px;color:#41484b">${s}</div></div>`;nbs.appendChild(d);return d});
function layout(sec,t,visible){
  // items whose time<=t, bottom anchored at 1170 within chat (height 1210)
  let items=[];
  sec.forEach(m=>{
    if(m.ty!==undefined && t>=m.ty && t<m.t) items.push({el:m.tyEl,h:m.tyH,k:eo(p(t,m.ty,m.ty+.2)),typ:true,t0:m.ty});
    if(t>=m.t) items.push({el:m.el,h:m.h,k:m.t<0?1:eo(p(t,m.t,m.t+.25)),t0:m.t});
  });
  sec.forEach(m=>{m.el.style.opacity=0; if(m.tyEl) m.tyEl.style.opacity=0});
  if(!visible) return;
  let y=1170;
  for(let i=items.length-1;i>=0;i--){const it=items[i];
    const hh=it.h*it.k; y-=hh;
    it.el.style.top=y+'px';
    const pop=it.t0<0?1:eback(p(t,it.t0,it.t0+.3));
    it.el.style.opacity=it.t0<0?1:p(t,it.t0,it.t0+.08);
    it.el.style.transformOrigin=it.el.classList.contains('me')?'100% 100%':'0 100%';
    it.el.style.transform=`scale(${.7+.3*pop})`;
    if(it.typ){const dots=it.el.querySelectorAll('i');dots.forEach((d,j)=>{d.style.transform=`translateY(${-8*Math.max(0,Math.sin(t*9-j*.9))}px)`})}
  }
}
window.render=function(t){
  // hook
  const hk=$('hook');
  if(t<2.4){const k=eo(p(t,1.95,2.35));show(hk,1-k,-k*120,1-.15*k)} else hk.style.opacity=0;
  // header status
  const typing=(t>=2.25&&t<2.75)||(t>=3.95&&t<4.45)||(t>=9.8&&t<10.15);
  $('st').textContent=typing?'typing...':'online';
  // section A out 5.9-6.2, B in from 6.9
  const aOut=eo(p(t,5.95,6.25));
  layout(SA,t,t<6.25);
  if(t<6.25) SA.forEach(m=>{if(t>=m.t){m.el.style.opacity=(m.t<0?1:Math.min(1,p(t,m.t,m.t+.08)))*(1-aOut);m.el.style.transform+=` translateY(${-aOut*200}px)`}});
  // shake on caps message
  const ch=$('chat'); let sx=0; if(t>=5.25&&t<5.75){const q=p(t,5.25,5.75);sx=Math.sin(q*Math.PI*8)*18*(1-q)} ch.style.transform=`translateX(${sx}px)`;
  layout(SB,t,t>=6.9);
  // one week later
  const L=$('later'); if(t>=6.15&&t<7.0){const k=eback(p(t,6.15,6.45));show(L,Math.min(p(t,6.15,6.3),1-p(t,6.8,7.0)),(1-k)*60,.9+.1*k)} else L.style.opacity=0;
  // notifications drop in from top, stacked; leave at 9.95
  nbEls.forEach((el,i)=>{const ti=NB[i][0];
    if(t<ti||t>=10.2){el.style.opacity=0;return}
    const k=eback(p(t,ti,ti+.35)); const out=eo(p(t,9.85+i*.05,10.15+i*.05));
    el.style.top=(220+i*148)+'px';
    show(el,p(t,ti,ti+.08),(1-k)*-160-out*700,1)});
  // end card: wipe from left then ink
  const w=$('wipe'); w.style.width=(t>=12.15&&t<12.75?eo(p(t,12.15,12.5))*1080:0)+'px';
  $('E').style.opacity=t>=12.45?p(t,12.45,12.65):0;
  const lk=eback(p(t,12.6,13.0));
  show($('elogo'),p(t,12.6,12.75),(1-lk)*40,.85+.15*lk);
  show($('e1'),p(t,12.85,13.0),(1-eo(p(t,12.85,13.15)))*30);
  show($('e2'),p(t,13.0,13.15),(1-eo(p(t,13.0,13.3)))*30);
  const pulse=t>13.8?1+.03*Math.sin((t-13.8)*6):1;
  show($('e3'),p(t,13.2,13.35),(1-eo(p(t,13.2,13.5)))*30,pulse*(.9+.1*eback(p(t,13.2,13.55))));
  show($('e4'),p(t,13.45,13.65),0);
};
document.fonts.ready.then(()=>{measure();render(0)});
render(0);
</script>
</body></html>
